<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Level-Up Gamer</title>
    <link rel="stylesheet" href="../CSS/estilos.css">
</head>

<body>

<header>
    <h2>LEVEL-UP GAMER</h2>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="registro.html">Registrarse</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<main>

    <section class="formulario">
        <h1>CONTÁCTANOS</h1>

        <form id="contacto">

            <label for="contacto-nombre">Nombre</label>
            <input type="text" id="contacto-nombre">
            <small id="error-contacto-nombre"></small>

            <label for="contacto-correo">Correo</label>
            <input type="email" id="contacto-correo">
            <small id="error-contacto-correo"></small>

            <label for="asunto">Asunto</label>
            <input type="text" id="asunto">
            <small id="error-asunto"></small>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje"></textarea>
            <small id="error-mensaje"></small>

            <button type="submit">Enviar mensaje</button>

        </form>
    </section>

</main>

<footer>
    <p>© 2026 Level-Up Gamer</p>
</footer>

<script src="../JS/script.js"></script>

</body>
</html>
