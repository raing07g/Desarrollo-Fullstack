<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Level-Up Gamer</title>
    <link rel="stylesheet" href="../CSS/estilos.css">
</head>

<body>
<header>
    <h2>LEVEL-UP GAMER</h2>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="registro.html">Registrarse</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<main>
    <section class="formulario">
        <h1>CREAR CUENTA</h1>
        <form id="registro">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" autocomplete="name">
            <small id="error-nombre"></small>

            <label for="correo">Correo</label>
            <input type="email" id="correo" autocomplete="email">
            <small id="error-correo"></small>

            <label for="edad">Edad</label>
            <input type="number" id="edad">
            <small id="error-edad"></small>

            <label for="password">Contraseña</label>
            <input type="password" id="password" autocomplete="new-password">
            <small id="error-password"></small>

            <label>
                <input type="checkbox" id="terminos">
                Acepto los términos y condiciones
            </label>
            <small id="error-terminos"></small>
            <button type="submit">Registrarme</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Level-Up Gamer</p>
</footer>

<script src="../JS/script.js"></script>
</body>
</html>
